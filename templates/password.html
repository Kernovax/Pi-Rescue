<!DOCTYPE html>
<html>

<head>

    <title>Connect to Wi-Fi</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🍓 Pi-Rescue</h1>

    <h2>Connect to Wi-Fi</h2>

    <form id="connectForm" action="/connect" method="post" onsubmit="return showConnecting(event)">
          
          

        <input
            type="hidden"
            name="ssid"
            value="{{ ssid }}">

        <p><b>Network</b></p>

        <div class="network">

            📶 {{ ssid }}

        </div>

        <p><b>Password</b></p>

        <div class="password-box">

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter Wi-Fi Password"
                required>

            <button
                type="button"
                id="toggleBtn"
                class="eye-button"
                onclick="togglePassword()">

                show

            </button>

        </div>

        <br>

        <button type="submit">

            Connect

        </button>

    </form>

    <br>

    <a href="/wifi">

        <button
            type="button"
            class="back-button">

            Back

        </button>

    </a>

    <div class="footer">

        Pi-Rescue v1.0.0 • Raspberry Pi Recovery Portal

    </div>

</div>

<div id="overlay" class="overlay" style="display:none;">

    <div class="overlay-card">

        <h2>🍓 Pi-Rescue</h2>

        <p id="overlayStatus">Connecting to Wi-Fi...</p>

        <p id="overlayStatus">Please wait.</p>

    </div>

</div>

<script>
function showConnecting(event){
    event.preventDefault();
    var form = document.getElementById("connectForm");
    document.getElementById("overlay").style.display="flex";
    var data = new FormData(form);

    requestAnimationFrame(function(){
        requestAnimationFrame(function(){
            setTimeout(function(){
                fetch(form.action, { method: "POST", body: data})
                    .then(function(){
                        window.location.href = "/wifi";
                    })
                    .catch(function(){
                        waitForPiRescue();
                    });
                
            },150);
        });
    });
    return false;
}

function waitForPiRescue(){
    var attempts = 0;
    var maxAttempts = 20;
    var statusEl = document.getElementById("overlayStatus");
    var subEl = document.getElementById("overlaySubStatus");

    statusEl.innerHTML = "Waiting for Pi-Rescue...";
    subEl.innerHTML = "The Pi is switching networks.";

    var interval = setInterval(function(){
        attempts++;
        fetch("/ping", { cache: "no-store" })
            .then(function(){
                clearInterval(interval);
                statusEl.innerHTML = "Pi-Rescue is back!";
                subEl.innerHTML = "Taking you to the network list...";
                window.location.href = "/wifi";
            })
            .catch(function(){
                if(attempts >= maxAttempts){
                    clearInterval(interval);
                    statusEl.innerHTML = "Pi-Rescue did not come back.";
                    subEl.innerHTML =
                        "This usually means it connected successfully. " +
                        "Reconnect your phone to the new Wi-Fi network, " +
                        "or reconnect to Pi-Rescue and re-open this page " +
                        "if it's still available.";
                }
            });
    }, 2000);
}

function togglePassword(){
    
    const box = document.getElementById("password");
    const btn = document.getElementById("toggleBtn");


    if(box.type==="password"){
        box.type="text";
        btn.innerHTML = "Hide";
    }else{
        box.type="password";
        btn.innerHTML = "Show";
    }

}

</script>

</body>

</html>
